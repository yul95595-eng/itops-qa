# 企业内部 IT 运维知识库助手 配置文件（入库模板）
# 注意: 本文件会提交到公开仓库, 所有口令一律用占位符。
#       本地真实口令请写入 config.local.ini（已在 .gitignore 中忽略）,
#       同名配置项由 config.local.ini 覆盖本文件。
#       密钥(DASHSCOPE_API_KEY)统一走 .env, 本文件不存任何密钥。

# MySQL 配置（错误码精确匹配层 + FAQ 层）
[mysql]
host = localhost
port = 3306
user = root
password = your_password
database = it_ops_qa

# Redis 配置（缓存层）
[redis]
host = localhost
port = 6379
password = your_password
db = 1

# Milvus 配置（RAG 向量检索层）
[milvus]
host = localhost
port = 19530
database_name = it_ops
collection_name = it_ops_wiki

# LLM 配置（密钥从 .env 读取, 这里只留模型名和地址）
[llm]
model = qwen-plus
dashscope_base_url = https://dashscope.aliyuncs.com/compatible-mode/v1

# 检索参数配置
[retrieval]
parent_chunk_size = 1200
child_chunk_size = 400
chunk_overlap = 50
retrieval_k = 20
candidate_m = 8
# RAG 相关性阈值: bge-reranker 最高分低于该值判定为未检索到相关内容(直接兜底,不联网)
# 分数为 reranker 输出的相关性概率(0~1), 越高越相关; 实测: 相关约0.5~0.99, 不相关约0.0~0.01
# 设为 0.1: 拦截明显不相关(0.0/0.01), 放过有相关性的内容
rerank_score_threshold = 0.1

# 应用配置
[app]
valid_sources = ["network", "account", "printer", "software"]
customer_service = IT服务台 400-000-0000（工作时间 9:00-18:00）
# 管理口令: 保护上传/删除/批量导入等写操作。占位符请勿直接使用, 本地在 config.local.ini 覆盖
admin_token = your_admin_token
