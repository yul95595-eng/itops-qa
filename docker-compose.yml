# docker-compose.yml
# IT 运维知识库助手 —— 全栈编排（应用 + 依赖服务）
#
# 服务清单:
#   app    : FastAPI 应用（本仓库代码构建, 端口 8000）
#   mysql  : 错误码 / FAQ / 文档登记 / 知识缺口
#   redis  : FAQ 与答案缓存
#   etcd   : Milvus 元数据（Milvus 依赖, 不对外）
#   minio  : Milvus 对象存储（Milvus 依赖, 控制台 9001）
#   milvus : 向量数据库（端口 19530）
#
# 用法:
#   docker compose up -d --build   # 构建并拉起全部服务
#   docker compose down            # 停止并移除容器(数据卷保留)
#   docker compose down -v         # 停止并清空数据(彻底重置)
#
# 说明:
#   模型权重(BGE-M3 / bge-reranker)体积 2GB+, 不打进镜像,
#   由 ./retrieval/models 挂载进容器; 首次运行需先下载(见 README)。

services:
  # ---- 应用: FastAPI 服务 ----
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: itops-qa:latest
    container_name: itops-app
    environment:
      # 容器内用服务名访问依赖, 覆盖 config.ini 里的 localhost
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-your_password}
      MYSQL_DATABASE: it_ops_qa
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-your_password}
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-your_admin_token}
    ports:
      - "8000:8000"
    volumes:
      # 模型权重只读挂载（不打进镜像）
      - ./retrieval/models:/app/retrieval/models:ro
      # 内置知识库 + 上传文件留存
      - ./data:/app/data
      # 日志落盘
      - ./logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    restart: unless-stopped

  # ---- MySQL: 错误码 / FAQ / 文档登记 / 知识缺口 ----
  mysql:
    image: mysql:8.0
    container_name: itops-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-your_password}
      MYSQL_DATABASE: it_ops_qa
      TZ: Asia/Shanghai
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      # 宿主端口用 3307, 避免与本机已装的 MySQL(3306) 冲突; 容器内应用走 mysql:3306
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---- Redis: FAQ/答案缓存 ----
  redis:
    image: redis:7-alpine
    container_name: itops-redis
    environment:
      # 供 healthcheck 在容器内展开, 值由 .env 提供(未设置时用占位符)
      REDIS_PASSWORD: ${REDIS_PASSWORD:-your_password}
    command: redis-server --requirepass ${REDIS_PASSWORD:-your_password}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---- Milvus 依赖: etcd(元数据) ----
  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    container_name: itops-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 5

  # ---- Milvus 依赖: minio(对象存储, 存向量/段文件) ----
  minio:
    image: minio/minio:latest
    container_name: itops-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 5

  # ---- Milvus standalone: 向量数据库 ----
  milvus:
    image: milvusdb/milvus:v2.4.0
    container_name: itops-milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 5
      # Milvus 冷启动较慢, 给 60 秒缓冲再开始计失败
      start_period: 60s

volumes:
  mysql_data:
  redis_data:
  etcd_data:
  minio_data:
  milvus_data:
